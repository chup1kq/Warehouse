services:

  app:
    build: .
    container_name: warehouse-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/warehouse
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: warehouse-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: